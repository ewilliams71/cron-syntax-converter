[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cronconv"
version = "0.1.0"
description = "Convert cron expressions between standard and Quartz syntax"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ewilliams71"}]

[project.scripts]
cronconv = "cronconv.cli:main"

[tool.setuptools.packages.find]
include = ["cronconv*"]
